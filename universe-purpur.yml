# =============================================================================
# UniversePurpur / UniverseSpigot - Hyper-Scale Architecture Profile
# Author: DevPapo
# Target: Massive Mega-Networks & Multi-Lobby Clusters (+15,000 Players Online)
# =============================================================================

version: 4
profile: 15k-hyper-scale

global:
  enabled: true

  # ---------------------------------------------------------------------------
  # 5-Tier Hyper-Scale Dynamic MSPT Governor
  # Maintains steady 20.0 TPS even under sudden massive surges of 15k+ players.
  # ---------------------------------------------------------------------------
  tick:
    dynamic-throttle: true
    target-mspt: 38.0                  # Conservative target ensures constant 20.0 TPS
    hard-limit-mspt: 46.0              # Triggers Level 4 Hyper-Scale Lockdown
    emergency-lag-protection: true     # Prevents server crash / lockup under extreme loads
    skip-non-critical-entity-ticks: true
    skip-distant-player-updates: true

  # ---------------------------------------------------------------------------
  # Entity & Mob Optimization (Eliminates O(N^2) bottlenecks)
  # ---------------------------------------------------------------------------
  mobs:
    global-spawning-enabled: true
    global-ai-enabled: true
    disable-passive-mobs: false
    disable-hostile-mobs: false
    disable-ambient-mobs: true         # Ambient mobs (bats, etc.) disabled by default
    disable-water-mobs: false
    disable-boss-mobs: false

    # Collision Limiter: Reduces O(N^2) collision checks to O(1)
    max-collisions-per-entity: 1       # Hard cap on entity push collisions
    player-collisions-enabled: false   # Disables player pushing player in crowded areas
    inactive-entity-tick-rate: 20      # Inactive entities tick once every second (20 ticks)

    # DAB (Dynamic Activation of Brain)
    dab:
      enabled: true
      max-tick-freq: 20                # Throttle brain ticks for distant mobs to 1/20 ticks
      activation-distance: 12          # Full brain ticks only within 12 blocks of player

    item-merge-radius: 4.0             # Merges ground items aggressively
    disable-inactive-item-ticks: true  # Completely freezes items resting on the ground

  # ---------------------------------------------------------------------------
  # Netty & Network Throughput (+15,000 Concurrent Connections)
  # ---------------------------------------------------------------------------
  network:
    async-compression: true
    compression-threshold: 512         # Optimized threshold avoids CPU churn on small packets
    tcp-nodelay: true                  # Immediate packet dispatch, reduces player latency
    flush-consolidation: true          # Netty syscall batching for massive socket counts
    netty-event-loop-threads: 0        # 0 = Auto-detect (CPU Cores * 2)
    async-tablist-updates: true        # Asynchronous batching for 15k-player tab lists
    chat-async-dispatch: true          # Offload chat routing to thread pool

    # Adaptive Packet Rate Limiting (Anti-DoS / Anti-Crasher Floods)
    packet-rate-limit:
      enabled: true
      max-packets-per-second: 1200
      burst: 250
      adaptive: true                   # Automatically tightens burst window during lag spikes

    # Anti-Payload Spam
    anti-payload-spam:
      enabled: true
      max-custom-payload-size-kb: 16
      max-channels: 64

    # Player Tracking Range & Hypixel-style Dynamic Player Culling
    # Crucial: Caps max visible players per client so mega hubs never crash client/server
    tracking:
      max-tracked-entities-per-player: 40   # Caps entity packets sent per client tick
      max-visible-players-per-client: 32    # Each client renders only the 32 closest players
      range-player: 28                      # Player tracking distance in blocks
      range-animals: 16
      range-monsters: 24
      range-misc: 12

  # ---------------------------------------------------------------------------
  # Chunks & World Simulation
  # ---------------------------------------------------------------------------
  chunks:
    simulation-distance-cap: 3         # Strict simulation distance for massive player counts
    view-distance-cap: 6               # Visual distance (rendering only, minimal server tick load)
    async-chunk-io: true               # All chunk loading & generation run asynchronously
    dirty-save-only: true              # Never re-save chunks that were not modified

  # ---------------------------------------------------------------------------
  # Autosave & Disk I/O Throttling
  # ---------------------------------------------------------------------------
  data:
    autosave:
      enabled: true
      interval-seconds: 600            # Autosave every 10 minutes
      max-chunks-per-tick: 6           # Only 6 chunks saved per tick (smooth I/O curve)

  # ---------------------------------------------------------------------------
  # Hoppers & Redstone Optimization
  # ---------------------------------------------------------------------------
  hoppers:
    cache-inventory-lookups: true      # Caches destination inventory lookups
    throttle-empty-ticks: 8            # Empty hoppers wait 8 ticks before searching again

  redstone:
    max-updates-per-tick: 5000         # Caps runaway redstone clocks / lag machines

  # ---------------------------------------------------------------------------
  # Titan Enterprise Performance Modules
  # ---------------------------------------------------------------------------
  performance:
    spatial-grid-enabled: true         # 2D Spatial partitioning for O(1) nearby player lookups
    memory-auto-trim:
      enabled: true                    # Auto-cleans stale caches before Stop-The-World GC spikes
      threshold-percent: 85.0          # Triggers pruning if heap usage exceeds 85%

  # ---------------------------------------------------------------------------
  # Enterprise Exploit & Anti-Crasher Shield
  # ---------------------------------------------------------------------------
  security:
    anti-crash-shield:
      enabled: true                    # Defends against NaN vectors, oversized NBT and malformed packets

# =============================================================================
# Presets: Hyper-Scale Presets for +15,000 Players Environments
# =============================================================================
presets:
  # Mega Hub / Spawn Lobby (3,000 - 15,000 players per proxy group)
  15k-hyper-hub:
    ticks:
      random-tick-speed: 0
      max-block-updates-per-tick: 1000
    chunks:
      view-distance: 6
      simulation-distance: 2
    mobs:
      global-spawning-enabled: false
      global-ai-enabled: false
      max-collisions-per-entity: 0
      player-collisions-enabled: false
    tracking:
      max-visible-players-per-client: 24

  # High-Concurrency Minigame Nodes (Bedwars, Skywars, Duels, Practice)
  15k-mega-arena:
    ticks:
      random-tick-speed: 1
      max-block-updates-per-tick: 6000
    chunks:
      view-distance: 6
      simulation-distance: 3
    mobs:
      global-spawning-enabled: false
      global-ai-enabled: false
      max-collisions-per-entity: 1
      player-collisions-enabled: false
    tracking:
      max-visible-players-per-client: 48

  # Massive Survival / SMP / Skyblock Cluster
  15k-scale-smp:
    ticks:
      random-tick-speed: 1
      max-block-updates-per-tick: 5000
    chunks:
      view-distance: 6
      simulation-distance: 3
    mobs:
      global-spawning-enabled: true
      global-ai-enabled: true
      max-collisions-per-entity: 1
      player-collisions-enabled: false
    tracking:
      max-visible-players-per-client: 32

# =============================================================================
# World Rules: Assign presets and overrides to specific worlds
# =============================================================================
world-rules:
  # Default lobby world
  world:
    preset: 15k-hyper-hub
    enabled: true
    time:
      lock: true
      value: 6000
      cycle: false

  # Arena world example
  minigames_arena:
    preset: 15k-mega-arena
    enabled: true
    time:
      lock: true
      value: 12000
      cycle: false

  # Survival world example
  survival_world:
    preset: 15k-scale-smp
    enabled: true
    time:
      lock: false
      cycle: true
